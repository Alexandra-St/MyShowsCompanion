name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore MyShowsCompanion.slnx

      - name: Build
        run: dotnet build MyShowsCompanion.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MyShowsCompanion.slnx --configuration Release --no-build
